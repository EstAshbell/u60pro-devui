name: Build and publish Ashbell desktop

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 'Try merging upstream before building (conflicts keep this fork intact)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ashbell-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        id: sync
        if: github.event_name == 'workflow_dispatch' && inputs.sync_upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/33333s/zwrt-devui.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'conflict=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
            echo 'conflict=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Upstream conflicts; building the current Ashbell fork.'
            {
              echo '### Upstream sync needs review'
              echo 'The merge was aborted. This release uses the existing Ashbell source.'
              sed 's/^/- /' /tmp/conflicts.txt
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin HEAD:main
          echo 'conflict=false' >> "$GITHUB_OUTPUT"

      - name: Cache cross-build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/aarch64--musl--stable-2025.08-1
            ~/freetype
            ~/freetype-musl
            ~/litehtml
            ~/litehtml-musl
          key: u60-aarch64-musl-v3-litehtml-0.10-${{ runner.os }}

      - name: Prepare toolchain and libraries
        run: |
          set -euo pipefail
          [ -x "$HOME/aarch64--musl--stable-2025.08-1/bin/aarch64-linux-gcc" ] || bash scripts/_setup_toolchain.sh
          if [ ! -f "$HOME/freetype/src/base/ftbase.c" ]; then
            git clone https://github.com/freetype/freetype.git "$HOME/freetype"
            git -C "$HOME/freetype" checkout 42608f77f20749dd6ddc9e0536788eaad70ea4b5
          fi
          if [ ! -f "$HOME/litehtml/include/litehtml.h" ]; then
            git clone https://github.com/litehtml/litehtml.git "$HOME/litehtml"
            git -C "$HOME/litehtml" checkout 9bc84b8b8d15a4e50f18b327aa30955048b441c2
          fi
          [ -f "$HOME/freetype-musl/lib/libfreetype.a" ] || bash scripts/_build_freetype.sh
          [ -f "$HOME/litehtml-musl/lib/liblitehtml.a" ] || bash scripts/_build_litehtml.sh

      - name: Test and build
        run: |
          set -euo pipefail
          /bin/sh tests/test_shellcrash_mode.sh
          /bin/sh tests/test_wifi_control.sh
          python3 tests/test_ashbell_installer.py
          python3 tests/test_ufi_upload.py
          python3 tests/test_ui_contract.py
          python3 tests/test_pinned_header.py
          python3 tests/test_cpuctl.py
          python3 tests/test_data_transport.py
          python3 tests/test_runtime_controls.py
          python3 tests/test_wifi_profiles.py
          python3 scripts/build-ufi-plugin.py
          bash scripts/build.sh
          file u60pro-devui.stripped | grep -q 'ARM aarch64'

      - name: Assemble unified release
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release /tmp/datad-assets
          # Pin the backend whose SIM/timezone/traffic API matches this runtime.
          # A newer upstream datad is a separate compatibility migration.
          gh release download v0.6.7-remix.5 --repo scoltzero/zwrt-datad-remix \
            --pattern zwrt-datad-aarch64 --pattern version.json --dir /tmp/datad-assets
          echo '4ea3fdf921c077e077ce820669339f3844101415512775bf42e497c0471e7d0d  /tmp/datad-assets/zwrt-datad-aarch64' | sha256sum -c -
          echo 'b57f6f12335d3a0ff7ee842b64561c9ff89e614fcfc314ecc985b6fa409cb870  /tmp/datad-assets/version.json' | sha256sum -c -
          devui_hash=$(find src include scripts integrations -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-8)
          ui_hash=$(find ui -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-8)
          jq --arg dh "$devui_hash" --arg uh "$ui_hash" \
            '.devui.version += "+build." + $dh | .ui.version += "+build." + $uh' \
            version.json > /tmp/ashbell-version.json
          python3 scripts/package-ashbell-release.py \
            --manifest /tmp/ashbell-version.json --devui u60pro-devui.stripped \
            --datad /tmp/datad-assets/zwrt-datad-aarch64 \
            --datad-version /tmp/datad-assets/version.json --output release
          cp CHANGELOG.md release/CHANGELOG.md
          tar --exclude=__pycache__ --exclude='*.pyc' -czf release/source.tar.gz src include scripts ui tests docs integrations \
            third_party/stb Makefile lv_conf.h licenses LICENSE NOTICE.md README.md CHANGELOG.md version.json .github

          if gh release download --repo "$GITHUB_REPOSITORY" --pattern version.json \
              --output /tmp/current-version.json --clobber >/dev/null 2>&1 &&
             cmp -s release/version.json /tmp/current-version.json; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "tag=ashbell-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Save reviewable release assets
        uses: actions/upload-artifact@v4
        with:
          name: ashbell-devui-release
          path: release/

      - name: Publish latest release
        if: steps.release_meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" --latest --title "Ashbell desktop $TAG" \
            --notes 'Ashbell three-page desktop with ShellCrash controls, verified Wi-Fi switching and a complete install/update/uninstall/rollback manager. Backend pinned to datad-remix 0.6.7-remix.5.'
