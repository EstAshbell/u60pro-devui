<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body class="{{THEME}}">
  {{STATUSBAR}}
  <div class="subtop">
    <a href="act:backfunc" class="subback">返回</a>
    <span class="subname">ShellCrash</span>
  </div>

  <div class="card">
    <div class="title">ShellCrash 状态</div>
    <table>
      <tr><td class="kv-l">安装状态</td><td class="val">{{SC_INSTALLED}}</td></tr>
      <tr><td class="kv-l">运行状态</td><td class="val">{{SC_STATE}}</td></tr>
    </table>
  </div>

  <div class="card">
    <div class="title">服务控制 <span class="r muted">{{SC_ACTION_STATE}}</span></div>
    <div class="sc-actions">
      <a href="act:sc:start" class="sc-btn {{SC_START_CLASS}}">{{SC_START_LABEL}}</a>
      <a href="act:sc:stop" class="sc-btn {{SC_STOP_CLASS}}">{{SC_STOP_LABEL}}</a>
    </div>
    <p class="func-note">停止需要连续确认；操作期间网络可能短暂中断。</p>
  </div>

  <div class="card">
    <div class="title">代理模式 <span class="r muted">当前：{{SC_MODE_LABEL}}</span></div>
    <div class="sc-mode-actions">
      <a href="act:scmode:global" class="sc-mode-btn {{SC_MODE_GLOBAL_CLASS}}">全局</a>
      <a href="act:scmode:rule" class="sc-mode-btn {{SC_MODE_RULE_CLASS}}">规则</a>
      <a href="act:scmode:direct" class="sc-mode-btn {{SC_MODE_DIRECT_CLASS}}">直连</a>
    </div>
  </div>

  {{TOAST}}
  <div class="pgpad"></div>
</body>
</html>
